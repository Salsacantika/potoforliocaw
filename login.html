<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Museum - Neobrutalism</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="style.css">
    
    <style>
        .login-body {
            background-color: #FDFBF7;
            background-image: 
                linear-gradient(to right, rgba(0, 0, 0, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
            background-size: 24px 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #111;
            position: relative;
            overflow: hidden;
        }

        /* Objek Dekorasi Latar Belakang Khas Neobrutalism */
        .bg-shape {
            position: absolute;
            z-index: 0;
            border: 3px solid #111;
            font-weight: 900;
        }

        .shape-star-1 {
            top: 10%;
            left: 8%;
            font-size: 45px;
            color: #FFD166;
            -webkit-text-stroke: 2px #111;
            animation: float 4s ease-in-out infinite;
        }

        .shape-star-2 {
            bottom: 15%;
            right: 10%;
            font-size: 55px;
            color: #7B61FF;
            -webkit-text-stroke: 2px #111;
            animation: float 5s ease-in-out infinite reverse;
        }

        .shape-box-1 {
            top: 15%;
            right: 12%;
            width: 70px;
            height: 70px;
            background: #FFD166;
            border-radius: 16px;
            box-shadow: 5px 5px 0 #111;
            transform: rotate(15deg);
        }

        .shape-box-2 {
            bottom: 20%;
            left: 10%;
            width: 60px;
            height: 60px;
            background: #7B61FF;
            border-radius: 12px;
            box-shadow: 5px 5px 0 #111;
            transform: rotate(-10deg);
        }

        .shape-pill {
            top: 45%;
            left: 4%;
            padding: 8px 16px;
            background: #FF6B6B;
            color: white;
            border-radius: 99px;
            font-size: 11px;
            box-shadow: 4px 4px 0 #111;
            transform: rotate(-6deg);
        }

        .shape-badge-float {
            top: 35%;
            right: 6%;
            padding: 10px 18px;
            background: #4ECDC4;
            color: #111;
            border-radius: 12px;
            font-size: 12px;
            box-shadow: 4px 4px 0 #111;
            transform: rotate(8deg);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        .login-card {
            width: 100%;
            max-width: 450px;
            background: white;
            border: 4px solid #111;
            border-radius: 24px;
            box-shadow: 12px 12px 0 #111;
            padding: 40px;
            position: relative;
            z-index: 10;
        }

        .login-header {
            margin-bottom: 30px;
            text-align: center;
        }

        .login-header h1 {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: -2px;
            margin-top: 10px;
        }

        .login-header h1 span {
            color: #7B61FF;
            -webkit-text-stroke: 2px #111;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 3px solid #111;
            border-radius: 12px;
            background: #F9F6EE;
            font-family: "DM Sans", sans-serif;
            font-weight: 700;
            font-size: 14px;
            outline: none;
            box-shadow: 4px 4px 0 #111;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: #FFD166;
            color: #111;
            border: 3px solid #111;
            border-radius: 99px;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 6px 6px 0 #111;
            margin-top: 10px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .login-btn:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #111;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 12px;
            font-weight: 900;
            color: #111;
            text-decoration: underline;
        }

        .error-message {
            background: #EF476F;
            color: white;
            border: 2px solid #111;
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            font-weight: 900;
            margin-bottom: 20px;
            display: none;
            box-shadow: 3px 3px 0 #111;
        }

        .mini-label {
            display: inline-block;
            background: #FFD166;
            border: 3px solid #111;
            border-radius: 99px;
            padding: 6px 16px;
            font-size: 11px;
            font-weight: 900;
            box-shadow: 3px 3px 0 #111;
            margin-bottom: 15px;
        }
    </style>
</head>
<body class="login-body">

    <!-- Objek-objek Latar Belakang -->
    <div class="bg-shape shape-star-1">✦</div>
    <div class="bg-shape shape-star-2">✦</div>
    <div class="bg-shape shape-box-1"></div>
    <div class="bg-shape shape-box-2"></div>
    <div class="bg-shape shape-pill">MUSEUM VIRTUAL</div>
    <div class="bg-shape shape-badge-float">CURATOR ACCESS</div>

    <div class="login-card">
        <div style="text-align: center;">
            <div class="mini-label">AREA TERBATAS</div>
        </div>
        <div class="login-header">
            <h1>LOGIN <span>ADMIN</span></h1>
            <p style="font-size: 13px; margin-top: 5px; font-weight: 700; color: #555;">Khusus kurator untuk mengelola artefak museum.</p>
        </div>

        <div id="error-alert" class="error-message">Email atau password salah!</div>

        <form id="login-form">
            <div class="form-group">
                <label for="admin-email">EMAIL ADMIN</label>
                <input type="email" id="admin-email" placeholder="admin@museum.com" required>
            </div>
            
            <div class="form-group">
                <label for="admin-password">PASSWORD</label>
                <input type="password" id="admin-password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">MASUK SEBAGAI ADMIN &rarr;</button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <a href="index.html" class="back-link">&larr; KEMBALI KE BERANDA (MODE USER)</a>
        </div>
    </div>

    <!-- SCRIPT UTAMA SUPABASE & LOGIN (Tanpa Card/Alert, Langsung Masuk) -->
    <script>
        const SUPABASE_URL = 'https://skbedgzcqwehxjunaocl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrYmVkZ3pjcXdlaHhqdW5hb2NsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NTQ1NzYsImV4cCI6MjEwNDMzMDU3Nn0.f2h_H_EppRgVLLvoOmu7T7KyAfmmgMs-WT5AXsasqWE';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginForm = document.getElementById('login-form');
        const errorAlert = document.getElementById('error-alert');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value.trim();

            errorAlert.style.display = 'none';

            try {
                const { data, error } = await _supabase
                    .from('admins')
                    .select('*')
                    .eq('email', email)
                    .eq('password', password);

                if (error) {
                    throw error;
                }

                if (data && data.length > 0) {
                    localStorage.setItem('isAdminLoggedIn', 'true');
                    localStorage.setItem('adminEmail', data[0].email);
                    
                    // Langsung pindah ke index.html tanpa card / alert
                    window.location.href = 'index.html'; 
                } else {
                    errorAlert.style.display = 'block';
                    errorAlert.textContent = 'Email atau password salah!';
                }
            } catch (err) {
                errorAlert.style.display = 'block';
                errorAlert.textContent = 'Terjadi kesalahan: ' + err.message;
            }
        });
    </script>
</body>
</html>
